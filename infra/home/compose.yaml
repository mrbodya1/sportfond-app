name: sportfond-public-api
services:
  api:
    image: python:3.13-slim
    user: "999:986"
    command: ["python", "-B", "/app/app_server.py", "--bind", "0.0.0.0", "--port", "8080", "--ai-env", "/private/openai.env", "--smtp-env", "/private/mail.env", "--app-env", "/private/app.env", "--data-dir", "/runtime/data", "--upload-dir", "/runtime/uploads"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1
    pids_limit: 80
    volumes:
      - /mnt/d/Projects/sportfond-app/backend:/app:ro
      - /mnt/d/Projects/sportfond-app/runtime:/runtime
      - /var/lib/sentinelx/edit-test/sportfond-home/public/openai.env:/private/openai.env:ro
      - /var/lib/sentinelx/edit-test/sportfond-home/public/mail.env:/private/mail.env:ro
      - /var/lib/sentinelx/edit-test/sportfond-home/public/app.env:/private/app.env:ro
    ports:
      - "127.0.0.1:18767:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
  https:
    image: caddy@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 192m
    cpus: 1
    pids_limit: 80
    depends_on:
      api: {condition: service_healthy}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
  backup:
    image: python:3.13-slim
    user: "999:986"
    command: ["python", "-B", "/app/backup_data.py", "--runtime", "/runtime", "--interval", "86400"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 192m
    pids_limit: 32
    depends_on:
      api: {condition: service_healthy}
    volumes:
      - /mnt/d/Projects/sportfond-app/backend:/app:ro
      - /mnt/d/Projects/sportfond-app/runtime:/runtime
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
volumes:
  caddy_data:
  caddy_config:


